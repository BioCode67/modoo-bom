<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <style>
    body { font-family: 'Malgun Gothic', sans-serif; width: 300px; margin: 0; padding: 14px; background: #fffaf3; color: #1f2937; }
    h1 { font-size: 15px; margin: 0 0 8px; color: #16a34a; }
    .step { font-size: 13px; line-height: 1.5; background: #fff; border: 1px solid #dcfce7; border-radius: 12px; padding: 10px; min-height: 40px; white-space: pre-wrap; }
    .muted { color: #6b7280; font-size: 11px; margin-top: 8px; }
    .badge { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 999px; background: #dcfce7; color: #15803d; }
  </style>
</head>
<body>
  <h1>🌱 모두봄 복지 에이전트</h1>
  <div id="doc" class="badge">대기 중</div>
  <div id="step" class="step" style="margin-top:8px">배포 사이트에서 서류 발급을 시작하면 여기에 진행 상황이 표시됩니다.</div>
  <div class="muted">개인정보는 이 브라우저 안에서만 처리되고 서버로 전송되지 않습니다.</div>
  <button id="diag" style="margin-top:8px;width:100%;font-size:12px;padding:6px;border:1px solid #dcfce7;border-radius:10px;background:#fff;cursor:pointer">🔍 진단 복사 (문제가 있을 때)</button>
  <script src="popup.js"></script>
</body>
</html>
