<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- 트위터/디스코드/슬랙(2:1 크롭 링크카드)용 와이드 변형 — og.svg(카카오용 1:1)와 동일 비주얼 언어 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0fdf4"/>
      <stop offset="0.55" stop-color="#dcfce7"/>
      <stop offset="1" stop-color="#fef3c7"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#16a34a"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="120" cy="560" r="110" fill="#bbf7d0" opacity="0.5"/>
  <circle cx="1090" cy="90" r="90" fill="#fed7aa" opacity="0.45"/>

  <!-- 새싹 마스코트 — 우측 -->
  <g transform="translate(830,135) scale(5.4)">
    <circle cx="32" cy="32" r="36" fill="#ffffff" opacity="0.75"/>
    <path d="M20 46 H44 L41.5 58 H22.5 Z" fill="#fb923c"/>
    <rect x="17" y="42" width="30" height="6" rx="3" fill="#f97316"/>
    <rect x="30" y="26" width="4" height="18" rx="2" fill="#16a34a"/>
    <ellipse cx="21" cy="33" rx="9" ry="4.5" transform="rotate(-28 21 33)" fill="#22c55e"/>
    <ellipse cx="43" cy="33" rx="9" ry="4.5" transform="rotate(28 43 33)" fill="#22c55e"/>
    <circle cx="32" cy="21" r="10" fill="#4ade80"/>
    <path d="M32 11 q4 -4 6.5 0 q-3 3 -6.5 1.5 Z" fill="#86efac"/>
    <circle cx="29" cy="21" r="1.5" fill="#1f3d2b"/>
    <circle cx="35" cy="21" r="1.5" fill="#1f3d2b"/>
    <circle cx="26.5" cy="23.5" r="1.8" fill="#fb7185" opacity="0.6"/>
    <circle cx="37.5" cy="23.5" r="1.8" fill="#fb7185" opacity="0.6"/>
  </g>

  <!-- 텍스트 — 좌측 정렬 -->
  <text x="90" y="235" font-family="Apple SD Gothic Neo, Malgun Gothic, AppleGothic, NanumGothic, sans-serif" font-size="150" font-weight="800" fill="url(#title)">모두봄</text>
  <text x="92" y="330" font-family="Apple SD Gothic Neo, Malgun Gothic, AppleGothic, NanumGothic, sans-serif" font-size="52" font-weight="700" fill="#1f2937">내 복지 혜택, 모두 찾아드릴게요</text>
  <text x="92" y="395" font-family="Apple SD Gothic Neo, Malgun Gothic, AppleGothic, NanumGothic, sans-serif" font-size="34" font-weight="500" fill="#4b5563">AI 맞춤 복지 · 확인부터 신청·관리까지</text>

  <!-- 배지 pill -->
  <rect x="90" y="470" width="300" height="66" rx="33" fill="#22c55e"/>
  <text x="240" y="513" text-anchor="middle" font-family="Apple SD Gothic Neo, Malgun Gothic, AppleGothic, sans-serif" font-size="30" font-weight="700" fill="#ffffff">회원가입 없이 무료</text>
  <rect x="410" y="470" width="280" height="66" rx="33" fill="#ffffff" stroke="#fdba74" stroke-width="3"/>
  <text x="550" y="513" text-anchor="middle" font-family="Apple SD Gothic Neo, Malgun Gothic, AppleGothic, sans-serif" font-size="30" font-weight="700" fill="#ea580c">복지 5,300여 건</text>
</svg>
