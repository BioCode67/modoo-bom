name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
# 배포 직렬화 — 연속 푸시 시 러너 큐 순서에 따라 '옛 커밋의 느린 런'이 '새 커밋의 빠른 런'을
# 나중에 덮어 gh-pages가 구버전으로 남는 역전이 실측됨(run 104가 105보다 늦게 끝나 f36f812 잔존).
# 새 푸시가 오면 진행 중인 이전 배포를 취소하고 최신만 배포한다.
concurrency:
  group: deploy-gh-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
        working-directory: frontend
      # 품질 게이트 — 빌드만 되는 회귀가 라이브로 새지 않게(lint 0 · 타입 0 · vitest 710+)
      - run: npm run lint
        working-directory: frontend
      - run: npx tsc --noEmit
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: frontend/dist
