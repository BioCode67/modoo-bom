name: 데스크탑 앱 빌드·게시

# 데스크탑 앱(Windows) 무인 빌드·게시 — build-installer.bat + publish-release.bat 체인을
# GitHub Actions(windows-latest)로 재현한다. 팀 PC 없이도 새 앱 릴리스를 만들 수 있다.
#
# 단계(bat 파리티): dist-app 빌드(온디바이스 AI 모델 동봉) → PyInstaller onedir →
#   패키징 스모크(실행파일 실기동 — installed-app.py, bat 2.5단계와 동일 게이트) →
#   배포 ZIP → Inno Setup 설치 exe → GitHub Release(--latest) 게시.
# 홈 CTA 는 releases/latest/download/ModooBom-Setup.exe 라 게시 즉시 다운로드가 새 빌드로 바뀐다.
#
# 정직성 게이트 2곳:
#  - 모델 동봉 검증: 차단망(시연장) 다국어 검색의 핵심이므로, 동봉이 안 됐으면 CDN 폴백 빌드를
#    조용히 게시하지 않고 정직하게 실패한다.
#  - 패키징 스모크: 번들 누락(hiddenimport·dist-app·Playwright 드라이버 파손)을 실기동으로 확인.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "릴리스 태그 (app-vX.Y.Z) — --latest 게시로 홈 다운로드 버튼이 자동 갱신됨"
        required: true
        default: app-v0.3.3

permissions:
  contents: write

concurrency:
  group: build-app
  cancel-in-progress: false

env:
  PYTHONUTF8: "1" # 한글 파일명·출력 인코딩 안전(Windows 러너)

jobs:
  build-and-release:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 프론트 앱 빌드(dist-app — postbuild:app 이 모델을 받아 동봉)
        working-directory: frontend
        run: |
          npm ci
          npm run build:app

      - name: 모델 동봉 검증(차단망 다국어의 핵심 — 누락 시 정직하게 실패)
        working-directory: frontend
        run: |
          $required = @(
            "dist-app/models/Xenova/multilingual-e5-small/config.json",
            "dist-app/models/Xenova/multilingual-e5-small/tokenizer.json",
            "dist-app/models/Xenova/multilingual-e5-small/tokenizer_config.json",
            "dist-app/models/Xenova/multilingual-e5-small/onnx/model_quantized.onnx",
            "dist-app/models/ort/ort-wasm-simd-threaded.wasm"
          )
          $missing = $required | Where-Object { -not (Test-Path $_) }
          if ($missing) {
            Write-Host "::error::모델 동봉 실패 — 누락: $($missing -join ', ') (HF 다운로드 로그 확인)"
            exit 1
          }
          $onnxMB = [math]::Round((Get-Item "dist-app/models/Xenova/multilingual-e5-small/onnx/model_quantized.onnx").Length / 1MB, 1)
          Write-Host "모델 동봉 확인 — ONNX ${onnxMB}MB"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 에이전트 의존성 설치(경량 — requirements-local, setup-local.bat 파리티)
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-local.txt pyinstaller

      - name: PyInstaller 빌드(onedir)
        working-directory: backend
        run: python -m PyInstaller --clean --noconfirm modoobom_agent.spec

      - name: 패키징 스모크(실행파일 실기동 — 서빙·RPA 준비·브라우저 기동)
        working-directory: frontend
        run: python e2e/installed-app.py

      - name: 배포 ZIP 생성(첫 실행 안내 동봉)
        run: |
          if (Test-Path "backend/사용법-README.txt") {
            Copy-Item "backend/사용법-README.txt" "backend/dist/모두봄-에이전트/사용법-README.txt" -Force
          }
          Compress-Archive -Path "backend/dist/모두봄-에이전트/*" -DestinationPath "backend/dist/모두봄-에이전트.zip" -Force

      - name: Inno Setup 준비(+한국어 언어파일 — 러너 기본 설치엔 없을 수 있음)
        run: |
          choco install innosetup -y --no-progress
          $langDir = "${env:ProgramFiles(x86)}\Inno Setup 6\Languages"
          $isl = Join-Path $langDir "Korean.isl"
          if (-not (Test-Path $isl)) {
            try {
              Invoke-WebRequest "https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/Korean.isl" -OutFile $isl
            } catch {
              Invoke-WebRequest "https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/Unofficial/Korean.isl" -OutFile $isl
            }
          }
          Write-Host "Korean.isl 준비 완료: $(Test-Path $isl)"

      - name: 설치 프로그램 빌드(Inno Setup)
        working-directory: backend
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer.iss
          if (-not (Test-Path "dist/모두봄-설치.exe")) {
            Write-Host "::error::설치 exe 미생성"
            exit 1
          }

      - name: 릴리스 게시(ASCII 자산명 — 한글명은 GitHub 이 제거함)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          Copy-Item "backend/dist/모두봄-설치.exe" "backend/dist/ModooBom-Setup.exe" -Force
          Copy-Item "backend/dist/모두봄-에이전트.zip" "backend/dist/ModooBom-Agent.zip" -Force
          $ver = $env:TAG -replace '^app-', ''
          gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$env:TAG" 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG "backend/dist/ModooBom-Setup.exe" "backend/dist/ModooBom-Agent.zip" --clobber
          } else {
            gh release create $env:TAG "backend/dist/ModooBom-Setup.exe" "backend/dist/ModooBom-Agent.zip" `
              --target $env:GITHUB_SHA --title "모두봄 데스크탑 앱 (Windows) $ver" `
              --notes-file "docs/앱-릴리스-노트.md" --latest
          }
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Write-Host "게시된 자산:"
          gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$env:TAG" --jq ".assets[].name"
