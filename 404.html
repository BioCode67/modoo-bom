<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>모두봄</title>
<link rel="icon" href="favicon.svg">
<style>
  :root { color-scheme: light; }
  * { margin: 0; box-sizing: border-box; }
  body {
    min-height: 100vh; display: grid; place-items: center;
    background: linear-gradient(180deg, #f0fdf4 0%, #ffffff 70%);
    font-family: Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    color: #14532d; text-align: center; padding: 24px;
  }
  .seed { font-size: 56px; line-height: 1; margin-bottom: 18px; }
  h1 { font-size: 28px; letter-spacing: -0.02em; margin-bottom: 12px; }
  p { font-size: 17px; color: #3f6212; line-height: 1.6; }
  .sub { margin-top: 10px; font-size: 14px; color: #65a30d; }
</style>
</head>
<body>
  <main>
    <div class="seed">🌱</div>
    <h1>모두봄</h1>
    <p>데모 페이지는 현재 잠시 비공개 상태입니다.</p>
    <p class="sub">이용해 주셔서 감사합니다.</p>
  </main>
  <script>
    // 이전 방문자의 PWA 서비스워커·캐시 정리(오프라인 캐시가 옛 화면을 계속 보여주지 않게)
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (rs) {
        rs.forEach(function (r) { r.unregister() })
      }).catch(function () {})
    }
    if (window.caches && caches.keys) {
      caches.keys().then(function (ks) { ks.forEach(function (k) { caches.delete(k) }) }).catch(function () {})
    }
  </script>
</body>
</html>
